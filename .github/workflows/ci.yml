name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: saheli
          POSTGRES_PASSWORD: saheli_ci_only
          POSTGRES_DB: saheli_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U saheli -d saheli_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://saheli:saheli_ci_only@localhost:5432/saheli_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Production dependency audit (server packages, blocking)
        run: npm audit --omit=dev --audit-level=high -w @saheli/api -w @saheli/domain -w @saheli/api-client -w @saheli/admin
      - name: Mobile dependency audit (reported, see ADR-012)
        run: npm audit --omit=dev -w @saheli/passenger -w @saheli/driver || true
      - run: npm run format:check
      - run: npm run lint
      - name: Build shared packages
        run: npm run build -w @saheli/domain -w @saheli/api-client
      - run: npm run typecheck
      - name: Check migrations match the schema
        working-directory: apps/api
        run: |
          npx drizzle-kit check
          npm run db:generate -- --name=ci_drift_check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::Schema changes are missing a migration. Run 'npm run db:generate -w @saheli/api'."
            git status --porcelain drizzle
            exit 1
          fi
      - name: Unit tests
        run: npm test
      - name: Integration tests (Postgres + PostGIS + Redis)
        run: npm run test:int
      - run: npm run build

  mobile-bundle:
    # Proves both apps compile to a release JS bundle (Metro + Hermes), without a device.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @saheli/domain -w @saheli/api-client
      - name: Bundle passenger app (Android)
        working-directory: apps/passenger
        run: npx expo export --platform android --output-dir /tmp/passenger
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid
      - name: Bundle driver app (Android)
        working-directory: apps/driver
        run: npx expo export --platform android --output-dir /tmp/driver
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid

  admin-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @saheli/domain -w @saheli/api-client
      - name: Build admin dashboard
        run: npm run build -w @saheli/admin
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  docker-images:
    # Builds the production images so a broken Dockerfile fails CI, not a deploy.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t saheli-api:ci .
      - name: Build admin image
        run: docker build -f apps/admin/Dockerfile -t saheli-admin:ci .
