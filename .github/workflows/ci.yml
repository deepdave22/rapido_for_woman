name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: saheli
          POSTGRES_PASSWORD: saheli_ci_only
          POSTGRES_DB: saheli_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U saheli -d saheli_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://saheli:saheli_ci_only@localhost:5432/saheli_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - name: Build shared domain package
        run: npm run build -w @saheli/domain
      - run: npm run typecheck
      - name: Check migrations match the schema
        working-directory: apps/api
        run: |
          npx drizzle-kit check
          npm run db:generate -- --name=ci_drift_check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::Schema changes are missing a migration. Run 'npm run db:generate -w @saheli/api'."
            git status --porcelain drizzle
            exit 1
          fi
      - name: Unit tests
        run: npm test
      - name: Integration tests (Postgres + PostGIS + Redis)
        run: npm run test:int
      - run: npm run build
